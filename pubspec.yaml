name: camsvirtusa
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_messaging: ^16.4.1
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  pdf: ^3.10.4
  path_provider: ^2.0.15
  permission_handler: ^12.0.3
  open_file: ^3.2.1
  firebase_storage: ^13.4.3
  flutter_blue_plus: ^2.3.10
  ble_peripheral: any
  geolocator: ^13.0.2
  camera: ^0.11.2+1
  file_picker: ^11.0.2
  read_pdf_text: ^0.3.1
    # Use this instead of qr_code_scanner
  mobile_scanner: ^7.2.0  # Compatible with newer Android Gradle Plugin
    # OR
  qr_code_scanner_plus: ^2.0.12



  # State management
  provider: ^6.1.2

  # Icons
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  google_mlkit_face_detection: ^0.13.1
  tflite_flutter: ^0.12.1
  image: ^4.5.4
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.3.3
  flutter_lints: ^5.0.0

flutter_native_splash:
  color: "#FFFFFF"        # white background
  image: logo.png # your app logo (we’ll add this next)
  android: true
  ios: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/homelogo1.png"


flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/homelogo1.png
    - assets/mobilefacenet.tflite
